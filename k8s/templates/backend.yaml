apiVersion: apps/v1
kind: Deployment
metadata: { name: wasrmfrp-backend, namespace: {{ .Values.namespace }} }
spec:
  replicas: 2
  selector: { matchLabels: { app: wasmfrp-backend } }
  template:
    metadata:
      labels:
        app: wasmfrp-backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "5000"
    spec:
      imagePullSecrets:
        - name: ecr-secret
      containers:
        - name: api
          image: "{{ .Values.wasmfrp.backend.image.repository }}:{{ .Values.wasmfrp.backend.image.tag }}"
          imagePullPolicy: "{{ .Values.wasmfrp.backend.image.pullPolicy }}"
          env:
            - name: DATABASE_URL
              value: http://surrealdb:8000
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: surreal-secret, key: user } }
            - name: DB_PASS
              valueFrom: { secretKeyRef: { name: surreal-secret, key: pass } }
          ports: [ { containerPort: 5000 } ]
---
apiVersion: v1
kind: Service
metadata: { name: wasmfrp-backend, namespace: {{ .Values.namespace }} }
spec:
  selector: { app: wasmfrp-backend }
  ports: [ { port: 80, targetPort: 5000 } ]
