apiVersion: v1
kind: Service
metadata:
  name: wasmfrp-metrics
  namespace: {{ .Values.namespace }}
  labels:
    app: wasmfrp
    release: k8s-monitoring  # important: matches Prometheus release label
spec:
  selector:
    app: wasmfrp  # must match the Deployment's pod label
  ports:
    - name: metrics
      port: 5000
      targetPort: 5000
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: wasmfrp-monitor
  namespace: {{ .Values.namespace }}
  labels:
    release: k8s-monitoring
spec:
  selector:
    matchLabels:
      app: wasmfrp
  namespaceSelector:
    matchNames:
      - {{ .Values.namespace }}
  endpoints:
    - port: metrics
      interval: 15s
      path: /metrics
